<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaJá | Marketing Digital & Serviços</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #2563eb;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            border: 3px solid #60a5fa;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f8fafc;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .work-showcase {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 2px solid #334155;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .work-showcase img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #1e293b;
            color: #ffffff;
            border: 2px solid #334155;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: block;
        }
        .btn:hover, .btn:focus {
            background-color: #2563eb;
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Oficial do ConectaJá -->
        <div class="profile-img">
            <img src="Logo.PNG" alt="Logo ConectaJá">
        </div>
        <h1>ConectaJá</h1>
        <p>Tecnologia que aproxima seu negócio.</p>
        
        <!-- Destaque do Trabalho -->
        <div class="work-showcase">
            <img src="CF09B222-9DB0-4897-BE5C-6A414FE39DC3.png" alt="Exemplo de Trabalho ConectaJá">
        </div>

        <div class="links-container">
            <!-- WhatsApp -->
            <a href="https://wa.me/message/5E24MGUROMF4P1" class="btn" target="_blank">Fale Comigo no WhatsApp</a>
            
            <!-- Instagram -->
            <a href="https://www.instagram.com/conectaja.digital?stkn=eWl6cW01bnFqcHQx&utm_source=qr" class="btn" target="_blank">Siga no Instagram</a>
            
            <!-- Google Business -->
            <a href="https://share.google/r8BAc0P7lGivoCG9t" class="btn" target="_blank">Google Business & Local</a>
            
            <!-- Cartões Digitais -->
            <a href="https://wa.me/message/5E24MGUROMF4P1" class="btn" target="_blank">Conheça nossos Cartões Digitais</a>
        </div>

        <div class="footer">
            © 2026 ConectaJá. Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
