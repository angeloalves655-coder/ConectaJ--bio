<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ConectaJá | Marketing Digital & Serviços</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #090d16, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .main-wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }
        .container {
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #2563eb;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
            border: 3px solid #60a5fa;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .profile-img:hover {
            transform: scale(1.05);
        }
        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            background-color: #1e293b;
            color: #ffffff;
            border: 2px solid #334155;
            padding: 16px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .btn span {
            font-size: 20px;
        }
        .btn:hover, .btn:focus {
            background-color: #2563eb;
            border-color: #60a5fa;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
        }
        .btn-whatsapp {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: #4ade80;
            animation: pulseGlow 2s infinite;
        }
        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #15803d, #16a34a);
            border-color: #86efac;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Carrossel de Trabalhos */
        .portfolio-section {
            width: 100%;
            text-align: center;
        }
        .portfolio-title {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .carousel-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 5px 2px 15px 2px;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }
        .carousel-container::-webkit-scrollbar {
            height: 6px;
        }
        .carousel-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .carousel-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .carousel-item {
            flex: 0 0 75%;
            max-width: 280px;
            aspect-ratio: 4 / 5;
            scroll-snap-align: center;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #334155;
            background-color: #1e293b;
            position: relative;
            transition: border-color 0.3s ease;
        }
        .carousel-item:hover {
            border-color: #60a5fa;
        }
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .footer {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
            width: 100%;
            text-align: center;
        }
        .footer a {
            color: #60a5fa;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .footer a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="profile-img">
                <img src="Logo.PNG" alt="Logo ConectaJá">
            </div>
            <h1>ConectaJá</h1>
            <p>Tecnologia que aproxima seu negócio.</p>
            
            <div class="links-container">
                <!-- WhatsApp com Mensagem Automática (Opção 3) -->
                <a href="https://wa.me/5519994604562?text=Ol%C3%A1!%20Gostaria%20de%20um%20or%C3%A7amento." class="btn btn-whatsapp" target="_blank">
                    <span>💬</span> Fale Comigo no WhatsApp
                </a>
                
                <a href="https://www.instagram.com/conectaja.digital?stkn=eWl6cW01bnFqcHQx&utm_source=qr" class="btn" target="_blank">
                    <span>📸</span> Siga no Instagram
                </a>
                
                <a href="https://share.google/r8BAc0P7lGivoCG9t" class="btn" target="_blank">
                    <span>⭐</span> Google Business & Local
                </a>
                
                <a href="https://wa.me/message/5E24MGUROMF4P1" class="btn" target="_blank">
                    <span>⚡</span> Conheça nossos Cartões Digitais
                </a>
            </div>
        </div>

        <!-- Seção do Carrossel de Trabalhos -->
        <div class="portfolio-section">
            <div class="portfolio-title">Alguns dos Nossos Trabalhos</div>
            <div class="carousel-container">
                <div class="carousel-item">
                    <img src="foto1.jpg" alt="Trabalho Realizado 1">
                </div>
                <div class="carousel-item">
                    <img src="foto2.jpg" alt="Trabalho Realizado 2">
                </div>
                <div class="carousel-item">
                    <img src="foto3.jpg" alt="Trabalho Realizado 3">
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 ConectaJá. Todos os direitos reservados.<br>
            Criado com <a href="https://www.instagram.com/conectaja.digital?stkn=eWl6cW01bnFqcHQx&utm_source=qr" target="_blank">ConectaJá</a> — Tecnologia que aproxima.
        </div>
    </div>
</body>
</html>
