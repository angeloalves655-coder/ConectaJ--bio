<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaJá | Marketing Digital & Serviços</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            border: 3px solid #60a5fa;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #1e293b;
            color: #ffffff;
            border: 2px solid #334155;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: block;
        }
        .btn:hover, .btn:focus {
            background-color: #2563eb;
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">🚀</div>
        <h1>ConectaJá</h1>
        <p>Soluções digitais e presença online para o seu negócio.</p>
        
        <div class="links-container">
            <!-- 1. Botão do WhatsApp (substitua SEU_NUMERO pelo seu número com DDI e DDD, ex: 5519999999999) -->
            <a href="https://wa.me/SEU_NUMERO?text=Olá!%20Vim%20pelo%20ConectaJá." class="btn" target="_blank">Fale Comigo no WhatsApp</a>
            
            <!-- 2. Botão do Instagram (substitua SEU_INSTAGRAM pelo seu nome de usuário) -->
            <a href="https://instagram.com/SEU_INSTAGRAM" class="btn" target="_blank">Siga no Instagram</a>
            
            <!-- 3. Cartões Digitais ou Google Business -->
            <a href="#" class="btn" target="_blank">Conheça nossos Cartões Digitais</a>
        </div>

        <div class="footer">
            © 2026 ConectaJá. Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
